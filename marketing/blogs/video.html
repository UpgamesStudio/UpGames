<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>UpGames Blogs · Tu sitio web en minutos</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
/* Lenguaje: galería clara (papel cálido + tinta + un solo índigo) con bloques pastel y cristal.
   Muy distinto al video SaaS (oscuro, neón verde). Letra ligera a gran escala; jerarquía por tamaño, no por peso. */
:root { --paper: #F5F3EE; --ink: #0B0B10; --ink2: #5A5F6B; --ind: #4D49FC; --lime: #E4FF97; --lilac: #C4BAFF; --blush: #FFC9C1; --aqua: #C7F8FB; --linea: rgba(11,11,16,.1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#lienzo { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; } .mono { font-family: 'JetBrains Mono', monospace; }
.blob { position: absolute; border-radius: 50%; filter: blur(130px); will-change: transform; }
#puntos { position: absolute; inset: 0; background-image: radial-gradient(rgba(11,11,16,.13) 1.6px, transparent 1.6px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(70% 70% at 50% 50%, #000, transparent); mask-image: radial-gradient(70% 70% at 50% 50%, #000, transparent); opacity: .55; }
.esc { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity; }
.tit { font-weight: 300; letter-spacing: -.045em; line-height: 1.02; }
.kick { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--ind); font-weight: 500; }
.ind { color: var(--ind); } .mut { color: var(--ink2); }
.marca { background: linear-gradient(transparent 62%, var(--lime) 62%, var(--lime) 92%, transparent 92%); padding: 0 .08em; }
/* Superficies */
.hoja { background: #fff; border-radius: 36px; box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 0 0 1.5px rgba(11,11,16,.07), 0 60px 110px -50px rgba(40,30,120,.35); }
.vidrio { background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(255,255,255,.42)); backdrop-filter: blur(26px) saturate(160%); border-radius: 32px;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85), inset 0 2px 0 #fff, 0 40px 90px -40px rgba(60,50,160,.45); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: 24px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); }
.pill.i { background: var(--ind); color: #fff; box-shadow: 0 18px 40px -16px rgba(77,73,252,.8), inset 0 2px 0 rgba(255,255,255,.35); }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 18px; font-weight: 700; font-size: 24px; }
.dot3 { display: flex; gap: 9px; } .dot3 i { width: 15px; height: 15px; border-radius: 50%; background: rgba(11,11,16,.13); }
/* Editor */
.barra { display: flex; align-items: center; gap: 16px; padding: 0 30px; height: 84px; border-bottom: 1.5px solid var(--linea); }
.blq { position: absolute; left: 36px; right: 36px; border-radius: 22px; padding: 22px 26px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); will-change: transform, opacity; }
.blq small { position: absolute; top: -13px; left: 20px; font: 500 15px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; background: var(--ind); color: #fff; padding: 4px 12px; border-radius: 99px; }
.barra-gris { height: 16px; border-radius: 8px; background: rgba(11,11,16,.09); margin: 12px 0; }
.arte { border-radius: 20px; position: relative; overflow: hidden; }
.fila { display: flex; justify-content: space-between; font-size: 24px; padding: 12px 0; border-bottom: 1.5px solid var(--linea); } .fila:last-child { border: 0; } .fila b { font-weight: 700; } .fila span { color: var(--ink2); }
#cursor { position: absolute; width: 46px; height: 46px; z-index: 60; opacity: 0; filter: drop-shadow(0 8px 12px rgba(30,20,90,.35)); left: 0; top: 0; }
.onda { position: absolute; border-radius: 50%; border: 4px solid var(--ind); opacity: 0; }
/* Mini blog (escena de temas) */
.mini { position: absolute; width: 520px; height: 640px; border-radius: 34px; overflow: hidden; will-change: transform, opacity; box-shadow: 0 50px 90px -40px rgba(30,20,100,.5), 0 0 0 1.5px rgba(11,11,16,.08); }
.mini .cab { height: 66px; display: flex; align-items: center; padding: 0 26px; gap: 12px; font-weight: 700; font-size: 21px; }
.mini .tl { height: 18px; border-radius: 9px; margin: 14px 26px; opacity: .85; }
.mini .tar { position: absolute; border-radius: 22px; }
.mini .pie { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; font: 500 15px 'JetBrains Mono', monospace; letter-spacing: .1em; }
#out div:empty { display: none; }
.av { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 26px; flex-shrink: 0; }
.burb { padding: 20px 26px; border-radius: 26px; font-size: 27px; line-height: 1.35; font-weight: 500; }
#nota { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; font: 400 15px 'JetBrains Mono', monospace; letter-spacing: .14em; color: rgba(11,11,16,.35); text-transform: uppercase; }
</style>
</head>
<body>
<div id="lienzo">
  <div class="blob" id="b1" style="width:900px;height:900px;background:#C4BAFF;left:-260px;top:-380px;opacity:.75"></div>
  <div class="blob" id="b2" style="width:800px;height:800px;background:#E4FF97;left:1380px;top:620px;opacity:.7"></div>
  <div class="blob" id="b3" style="width:700px;height:700px;background:#C7F8FB;left:1150px;top:-380px;opacity:.8"></div>
  <div class="blob" id="b4" style="width:700px;height:700px;background:#FFC9C1;left:-200px;top:700px;opacity:.55"></div>
  <div id="puntos"></div>
  <div id="escenas"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-7 2-3 7z" fill="#0B0B10" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="nota">Ejemplos ilustrativos · upgames.games</div>
</div>
<script>
'use strict';
/* ═══ Motor: todo se calcula en render(t); cada fotograma es exacto y reproducible ═══ */
const DUR = 36;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = { out: k => 1 - Math.pow(1 - k, 3), out5: k => 1 - Math.pow(1 - k, 5), io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, in: k => k * k * k,
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  spr: k => k >= 1 ? 1 : 1 - Math.exp(-7 * k) * Math.cos(k * 12) };
const en = (t, a, d, e = E.out) => e(clamp((t - a) / d));
const win = (t, a, b, fi = .4, fo = .4) => Math.min(clamp((t - a) / fi), clamp((b - t) / fo));
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = n => Math.round(n).toLocaleString('es-CO');
const $ = (tag, cls, html, padre, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; if (padre) padre.appendChild(e); return e; };
const S = (el, p) => { if (p.o != null) el.style.opacity = p.o; el.style.transform = `translate(${p.x || 0}px, ${p.y || 0}px) rotate(${p.r || 0}deg) scale(${p.s ?? 1})`; if (p.b != null) el.style.filter = p.b > .05 ? `blur(${p.b}px)` : 'none'; };
// Texto cinético: cada palabra sube desde una máscara, con rebote suave
const pal = (padre, str, cls, css) => { const e = $('div', cls, null, padre, css); let modo = '';
  str.split(' ').forEach((p, i, a) => { const abre = p.match(/^[\[{]/), cierra = p.match(/[\]}]$/); if (abre) modo = abre[0] === '[' ? 'ind' : 'marca';
    const limpio = p.replace(/^[\[{]/, '').replace(/[\]}]$/, ''); $('span', 'w' + (modo ? ' ' + modo : ''), limpio + (i < a.length - 1 ? ' ' : ''), e); if (cierra) modo = ''; }); return e; };
const kin = (el, t, a, gap = .09, d = .8, dy = 70) => [...el.children].forEach((w, i) => { const k = en(t, a + i * gap, d, E.back); w.style.opacity = clamp(k * 1.6); w.style.transform = `translateY(${(1 - k) * dy}px) rotate(${(1 - k) * 3}deg)`; });
const teclear = (el, str, k) => { el.textContent = str.slice(0, Math.round(clamp(k) * str.length)); };
const SFX = []; const sfx = (t, n, g = 1, p) => SFX.push({ t, n, g, p });
const ESC = [];
const escena = (a, b, crear, act) => { const r = $('div', 'esc', null, document.getElementById('escenas')); const ctx = crear(r) || {}; ESC.push({ a, b, r, act, ctx }); };
const cursor = document.getElementById('cursor');
// Cursor guiado por puntos de paso [t, x, y, (clic?)]: interpolación suave
const ruta = (t, pts) => { let a = pts[0], b = pts[pts.length - 1]; for (let i = 0; i < pts.length - 1; i++) if (t >= pts[i][0] && t <= pts[i + 1][0]) { a = pts[i]; b = pts[i + 1]; break; } if (t <= pts[0][0]) return { x: pts[0][1], y: pts[0][2] }; if (t >= b[0] && b === pts[pts.length - 1]) return { x: b[1], y: b[2] };
  const k = E.io(clamp((t - a[0]) / (b[0] - a[0]))); return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k) }; };
const CUR = []; // [a, b, puntos, clics[]]
const arte = i => ['linear-gradient(135deg,#C4BAFF,#8F86FF)', 'linear-gradient(135deg,#FFC9C1,#FF8E7B)', 'linear-gradient(135deg,#E4FF97,#B6E64A)', 'linear-gradient(135deg,#C7F8FB,#6ED8E6)'][i % 4];
const forma = i => ['<circle cx="50" cy="50" r="24" fill="rgba(255,255,255,.75)"/><circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4"/>', '<path d="M20 76l30-52 30 52z" fill="rgba(255,255,255,.78)"/>', '<rect x="26" y="26" width="48" height="48" rx="14" fill="rgba(255,255,255,.78)" transform="rotate(14 50 50)"/>', '<path d="M50 20l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="rgba(255,255,255,.8)"/>'][i % 4];
const miniArte = (padre, i, css) => $('div', 'arte', `<svg viewBox="0 0 100 100" style="position:absolute;left:50%;top:50%;width:62%;height:100%;transform:translate(-50%,-50%)">${forma(i)}</svg>`, padre, `background:${arte(i)};${css}`);

/* ═══ 1 · Gancho (0 – 3,9) ═══ */
escena(0, 3.95, r => {
  const w1 = pal(r, 'Escribe.', 'abs tit', 'left:210px;top:190px;font-size:230px');
  const w2 = pal(r, '[Publica.]', 'abs tit', 'left:210px;top:420px;font-size:230px');
  const w3 = pal(r, '{Crece.}', 'abs tit', 'left:210px;top:650px;font-size:230px');
  const ch = [['reseña', 'var(--lilac)', 1300, 230, -6], ['guía', 'var(--lime)', 1480, 420, 5], ['noticia', 'var(--blush)', 1250, 600, 4], ['top 5', 'var(--aqua)', 1520, 760, -4]].map(([t, c, x, y, rr]) => ({ el: $('div', 'abs chip', t, r, `left:${x}px;top:${y}px;background:${c}`), x, y, rr }));
  sfx(.35, 'nota', .8, 0); sfx(1.25, 'nota', .8, 2); sfx(2.15, 'nota', .9, 4); sfx(3.4, 'whoosh', .7);
  return { w1, w2, w3, ch };
}, (t, r, c) => {
  kin(c.w1, t, .3, .1, .9); kin(c.w2, t, 1.2, .1, .9); kin(c.w3, t, 2.1, .1, .9);
  c.ch.forEach((h, i) => { const k = en(t, .8 + i * .35, .8, E.spr); S(h.el, { o: clamp(k * 2), s: lerp(.3, 1, k), r: h.rr, y: Math.sin(t * 1.6 + i) * 8 }); });
  const k = en(t, 3.4, .55, E.in); S(r, { o: win(t, 0, 3.95, .2, .2), x: -k * 260, s: 1 - k * .06 });
});

/* ═══ 2 · Bloques (3,7 – 10,6) ═══ */
const PAL = [['Texto', 'var(--lilac)'], ['Imagen', 'var(--blush)'], ['Ficha', 'var(--lime)'], ['Descarga', 'var(--aqua)'], ['Video', '#fff'], ['Spotify', '#fff']];
escena(3.7, 10.7, r => {
  const k = $('div', 'abs kick', '01 · Editor por bloques', r, 'left:140px;top:150px');
  const h = pal(r, 'Arma tu entrada {con bloques.}', 'abs tit', 'left:140px;top:205px;font-size:92px;width:760px;line-height:1.04');
  const p = $('div', 'abs', 'Sin código. Arrastra, escribe y publica desde el celular.', r, 'left:140px;top:520px;width:640px;font-size:32px;line-height:1.4;color:var(--ink2);font-weight:400');
  const chips = PAL.map(([n, c], i) => $('div', 'abs chip', `<span style="opacity:.55">+</span>${n}`, r, `left:${140 + (i % 3) * 215}px;top:${650 + Math.floor(i / 3) * 96}px;background:${c};box-shadow:inset 0 0 0 1.5px rgba(11,11,16,.08)`));
  const ed = $('div', 'abs hoja', `<div class="barra"><div class="dot3"><i></i><i></i><i></i></div><span class="mono" style="font-size:19px;color:var(--ink2);letter-spacing:.08em">NUEVA ENTRADA</span><span style="flex:1"></span><span class="pill i" style="padding:10px 22px;font-size:20px">Publicar</span></div>`, r, 'left:960px;top:96px;width:860px;height:900px;overflow:hidden');
  const B = [];
  const mk = (css, html) => { const e = $('div', 'blq', html, ed, css); e.style.opacity = 0; B.push(e); return e; };
  const b1 = mk('top:120px;height:112px', '<small>Título</small><div id="b1t" style="font-size:44px;font-weight:700;letter-spacing:-.03em"></div>');
  const b2 = mk('top:262px;height:150px', '<small>Texto</small><div id="b2t" style="font-size:27px;line-height:1.45;color:#2c2f3a;min-height:80px"></div>');
  const b3 = mk('top:442px;height:190px;padding:0', '<small style="z-index:2">Imagen</small>'); miniArte(b3, 0, 'position:absolute;inset:0;border-radius:22px');
  const b4 = mk('top:662px;height:190px', '<small>Ficha</small><div class="fila"><b>Género</b><span>Acción</span></div><div class="fila"><b>Plataforma</b><span>Android</span></div><div class="fila"><b>Peso</b><span>1,2 GB</span></div>');
  const b5 = mk('top:662px;height:160px;display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#C7F8FB,#fff)', '<small>Descarga</small><div class="arte" style="width:96px;height:96px;background:' + arte(2) + '"></div><div style="flex:1"><b style="font-size:27px">Mod de rendimiento</b><div class="mut" style="font-size:20px;margin-top:4px">por @kale · descarga gratis</div></div><span class="pill i" style="font-size:22px">Descargar</span>');
  b5.style.opacity = 0;
  const onda = $('div', 'onda', null, r, 'width:90px;height:90px;margin:-45px 0 0 -45px');
  sfx(3.9, 'whoosh', .6); [4.95, 5.85, 6.75, 7.65, 8.55].forEach((t, i) => sfx(t, i % 2 ? 'pop' : 'pop2', .9, i)); sfx(9.6, 'campana', .8);
  return { k, h, p, chips, ed, b1, b2, b3, b4, b5, onda, t1: b1.querySelector('#b1t'), t2: b2.querySelector('#b2t') };
}, (t, r, c) => {
  S(c.k, { o: en(t, 3.95, .4), y: (1 - en(t, 3.95, .6)) * 20 }); kin(c.h, t, 4.05, .11, .85, 80); S(c.p, { o: en(t, 4.7, .6), y: (1 - en(t, 4.7, .7)) * 24 });
  c.chips.forEach((e, i) => { const k = en(t, 4.4 + i * .08, .7, E.spr); S(e, { o: clamp(k * 2), s: lerp(.5, 1, k), y: (1 - k) * 30 }); });
  const ed = en(t, 4.0, 1.0, E.out5); S(c.ed, { o: clamp(ed * 2), x: (1 - ed) * 220, y: (1 - ed) * 40, r: (1 - ed) * 2.5 });
  // Cada bloque cae desde su chip: aparece, rebota y se asienta
  const caida = (el, a, y0) => { const k = en(t, a, .75, E.spr); S(el, { o: clamp((t - a) / .15), y: (1 - k) * -90 + 0 * y0, s: lerp(.94, 1, k) }); };
  caida(c.b1, 5.0); caida(c.b2, 5.9); caida(c.b3, 6.8); caida(c.b4, 7.7);
  c.b4.style.opacity = t < 8.5 ? clamp((t - 7.7) / .15) : 1 - clamp((t - 8.5) / .25);   // la ficha cede su lugar a la descarga
  caida(c.b5, 8.6);
  teclear(c.t1, 'Reseña: mi mod favorito', (t - 5.1) / .9);
  teclear(c.t2, 'Corre a 60 FPS en mi celular de gama media. Así lo instalé, paso a paso…', (t - 6.0) / 1.6);
  // Cursor: va de chip en chip y de ahí al editor
  const P = [[4.4, 1000, 940], [4.9, 270, 700], [5.0, 270, 700], [5.5, 1300, 190], [5.8, 485, 700], [5.9, 485, 700], [6.4, 1300, 330], [6.7, 270, 800], [6.8, 270, 800], [7.4, 1300, 520], [7.6, 700, 800], [7.7, 700, 800], [8.4, 1300, 760], [8.5, 600, 800], [8.6, 600, 800], [9.3, 1650, 790], [9.9, 1700, 840]];
  const pos = ruta(t, P); const clic = [4.95, 5.85, 6.75, 7.65, 8.55, 9.65].reduce((a, ct) => a + Math.max(0, 1 - Math.abs(t - ct) / .12), 0);
  cursor.style.opacity = win(t, 4.4, 10.3, .3, .3); cursor.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${1 - clamp(clic) * .22})`;
  const q = en(t, 9.6, .8); c.onda.style.left = '1655px'; c.onda.style.top = '800px'; c.onda.style.opacity = (1 - q) * .8 * (t > 9.6 ? 1 : 0); c.onda.style.transform = `scale(${1 + q * 3})`;
  S(r, { o: win(t, 3.7, 10.7, .2, .35), x: en(t, 10.2, .5, E.in) * -240 });
});

/* ═══ 3 · Nexus escribe (10,3 – 16) ═══ */
escena(10.3, 16.0, r => {
  const k = $('div', 'abs kick', '02 · Nexus escritor', r, 'left:140px;top:150px');
  const h = pal(r, 'Nexus escribe {el borrador.}', 'abs tit', 'left:140px;top:205px;font-size:92px;width:760px');
  const p = $('div', 'abs', 'Elige un juego de UpGames y pide una reseña, una guía o una noticia. Tú la completas con tu experiencia.', r, 'left:140px;top:520px;width:640px;font-size:30px;line-height:1.45;color:var(--ink2);font-weight:400');
  const hoja = $('div', 'abs vidrio', `
    <div style="display:flex;align-items:center;gap:22px;padding:34px 38px 0"><div class="arte" style="width:104px;height:104px;background:${arte(1)}"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%">${forma(1)}</svg></div>
      <div><div class="mono" style="font-size:17px;letter-spacing:.14em;color:var(--ind)">PUBLICACIÓN DE UPGAMES</div><div style="font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:6px">Mod de rendimiento · Android</div></div></div>
    <div style="display:flex;gap:12px;padding:26px 38px 0"><span id="s1" class="chip" style="padding:11px 22px;font-size:22px;background:var(--lilac)">Reseña</span><span class="chip" style="padding:11px 22px;font-size:22px;background:rgba(11,11,16,.05)">Guía</span><span class="chip" style="padding:11px 22px;font-size:22px;background:rgba(11,11,16,.05)">Noticia</span><span style="flex:1"></span><span id="bn" class="pill i" style="padding:12px 26px;font-size:22px">✦ Escribir borrador</span></div>
    <div id="out" style="position:absolute;left:38px;right:38px;top:286px;bottom:34px;border-radius:24px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1.5px var(--linea);padding:28px 32px;overflow:hidden"></div>`, r, 'left:960px;top:150px;width:860px;height:780px');
  const out = hoja.querySelector('#out');
  const L = [['h', 'Lo mejor'], ['t', '- Corre fluido incluso con 3 GB de RAM'], ['t', '- La instalación toma menos de 5 minutos'], ['h', 'Lo peor'], ['t', '- Pesa 1,2 GB, hace falta espacio libre'], ['n', '[ Cuenta aquí cómo corrió en tu equipo ]']];
  const filas = L.map(([tp, tx]) => $('div', null, '', out, tp === 'h' ? 'font-size:30px;font-weight:700;letter-spacing:-.02em;margin:14px 0 6px' : tp === 'n' ? 'font-size:23px;color:var(--ind);margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(77,73,252,.08);font-weight:500' : 'font-size:25px;line-height:1.5;color:#2c2f3a;font-weight:400'));
