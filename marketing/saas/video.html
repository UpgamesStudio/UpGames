<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>UpGames · Video SaaS para creadores independientes</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root { --g: #39FF88; --cy: #5CE1FF; --vi: #8F7BFF; --bg: #04060B; --tx: #F4F7FA; --tx2: #AEB7C4; --tx3: #6C7686;
  --au: linear-gradient(120deg, #39FF88 0%, #4BF0C4 50%, #5CE1FF 100%); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--tx); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#lienzo { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.disp { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; }
.mono { font-family: 'JetBrains Mono', monospace; }
.au { background: var(--au); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

/* Fondo */
.blob { position: absolute; border-radius: 50%; filter: blur(110px); will-change: transform; }
#rejilla { position: absolute; left: -50%; right: -50%; bottom: -160px; height: 760px;
  background-image: linear-gradient(rgba(92,225,255,.3) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(143,123,255,.2) 1.5px, transparent 1.5px);
  background-size: 90px 90px; transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.5) 45%, transparent 88%); mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.5) 45%, transparent 88%); }
#vin { position: absolute; inset: 0; background: radial-gradient(75% 75% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
#destello { position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 50%, rgba(255,255,255,.95), rgba(92,225,255,.5) 45%, transparent 75%); opacity: 0; }
.pt { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; }

/* Escenas */
.esc { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity; }
.tit { font-weight: 700; letter-spacing: -.035em; line-height: 1.04; }
.kick { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: .28em; text-transform: uppercase; color: var(--g); }
.kick::before { content: ''; display: inline-block; width: 44px; height: 2px; background: var(--au); vertical-align: middle; margin-right: 18px; }

.cristal { background: linear-gradient(165deg, rgba(22,31,50,.86), rgba(9,13,22,.92)); border: 1.5px solid rgba(255,255,255,.1); border-radius: 30px;
  box-shadow: 0 50px 110px -50px rgba(0,0,0,.95), inset 0 1.5px 0 rgba(255,255,255,.08); }
.filo::before { content: ''; position: absolute; left: 40px; right: 40px; top: -1px; height: 2px; background: linear-gradient(90deg, transparent, #39FF88 30%, #5CE1FF 70%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); font-weight: 600; font-size: 24px; color: var(--tx2); }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 20px; background: var(--au); color: #031109; font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  box-shadow: 0 24px 50px -16px rgba(57,255,136,.85), inset 0 2px 0 rgba(255,255,255,.5); }
#cursor { position: absolute; width: 44px; height: 44px; z-index: 50; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.onda { position: absolute; border-radius: 50%; border: 3px solid var(--g); opacity: 0; }

/* Navegador (escena 3) */
.nav-top { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1.5px solid rgba(255,255,255,.08); }
.nav-top i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.16); }
.nav-url { margin-left: 22px; flex: 1; height: 38px; border-radius: 12px; background: rgba(255,255,255,.05); display: flex; align-items: center; padding: 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: var(--tx2); }
.tar { position: absolute; border-radius: 22px; overflow: hidden; background: linear-gradient(165deg, rgba(26,36,58,.95), rgba(10,15,26,.98)); border: 1.5px solid rgba(255,255,255,.09); box-shadow: 0 26px 50px -30px rgba(0,0,0,.9); }
.tar .im { height: 62%; margin: 8px 8px 0; border-radius: 15px; position: relative; overflow: hidden; }
.tar .ct { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .16em; color: var(--g); margin: 14px 16px 4px; }
.tar .tt { font-weight: 600; font-size: 21px; margin: 0 16px; white-space: nowrap; }
.tar .on { position: absolute; right: 10px; top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .1em; padding: 5px 10px; border-radius: 999px; background: rgba(4,6,11,.7); color: var(--g); border: 1px solid rgba(57,255,136,.45); }
.chipx { padding: 9px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: var(--tx2); }
.chipx.a { background: var(--au); color: #031109; border-color: transparent; }

/* Bento (escena 5) */
.bento { position: absolute; padding: 34px; overflow: hidden; }
.bento h4 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 22px 0 8px; }
.bento p { font-size: 23px; line-height: 1.35; color: var(--tx2); }
.ico { width: 68px; height: 68px; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.14); }
.ico svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.kpi { position: absolute; padding: 26px 28px; border-radius: 24px; background: rgba(255,255,255,.045); border: 1.5px solid rgba(255,255,255,.09); }
.kpi small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx3); }
.kpi b { display: block; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 50px; letter-spacing: -.03em; margin-top: 8px; }
#nota { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .12em; color: rgba(255,255,255,.3); text-transform: uppercase; }
</style>
</head>
<body>
<div id="lienzo">
  <div class="blob" id="b1" style="width:900px;height:900px;background:rgba(57,255,136,.22);left:1200px;top:-420px"></div>
  <div class="blob" id="b2" style="width:800px;height:800px;background:rgba(92,225,255,.16);left:-300px;top:-200px"></div>
  <div class="blob" id="b3" style="width:1100px;height:900px;background:rgba(143,123,255,.2);left:420px;top:640px"></div>
  <div id="rejilla"></div>
  <div id="pts"></div>
  <div id="escenas"></div>
  <div id="vin"></div>
  <div id="destello"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-7 2-3 7z" fill="#fff" stroke="#04060B" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="nota">Cifras ilustrativas · upgames.games</div>
</div>
<script>
'use strict';
/* ═══ Motor: todo se calcula en render(t) para grabar cuadro a cuadro ═══ */
const DUR = 40;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = { out: k => 1 - Math.pow(1 - k, 3), out5: k => 1 - Math.pow(1 - k, 5), in: k => k * k * k,
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  spr: k => k >= 1 ? 1 : 1 - Math.exp(-6.5 * k) * Math.cos(k * 13) };
const en = (t, a, d, e = E.out) => e(clamp((t - a) / d));
const win = (t, a, b, fi = .4, fo = .4) => Math.min(clamp((t - a) / fi), clamp((b - t) / fo));
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = n => Math.round(n).toLocaleString('es-CO');
const $ = (tag, cls, html, padre, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; if (padre) padre.appendChild(e); return e; };
const S = (el, p) => { if (p.o != null) el.style.opacity = p.o;
  el.style.transform = `translate(${p.x || 0}px, ${p.y || 0}px) rotateX(${p.rx || 0}deg) rotateY(${p.ry || 0}deg) rotate(${p.r || 0}deg) scale(${p.s ?? 1})`;
  if (p.b != null) el.style.filter = p.b > .05 ? `blur(${p.b}px)` : 'none'; };
// Texto cinético: cada palabra sube, se enfoca y aparece
const pal = (padre, str, cls, css) => { const e = $('div', cls, null, padre, css); str.split(' ').forEach((p, i, a) => $('span', 'w', p.replace(/\[(.+?)\]/, '<span class="au">$1</span>') + (i < a.length - 1 ? ' ' : ''), e)); return e; };
const kin = (el, t, a, gap = .075, d = .6, dy = 46) => [...el.children].forEach((w, i) => { const k = en(t, a + i * gap, d, E.out5); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * dy}px)`; w.style.filter = k < .98 ? `blur(${(1 - k) * 12}px)` : 'none'; });
const SFX = []; const sfx = (t, n, g = 1) => SFX.push({ t, n, g });
const GOLPES = []; const golpe = (t, f = 1) => GOLPES.push([t, f]);
const ESC = [];
const escena = (a, b, crear, act) => { const r = $('div', 'esc', null, document.getElementById('escenas')); const ctx = crear(r) || {}; ESC.push({ a, b, r, act, ctx }); };
const cursor = document.getElementById('cursor');
const ICO = {
  chispa: '<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
  vivo: '<circle cx="12" cy="12" r="3.2"/><path d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4"/>',
  grafica: '<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/>',
  gente: '<circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0112.4 0M16 4.8a3.4 3.4 0 010 6.4M21.2 20a6.2 6.2 0 00-4-5.8"/>',
  estrella: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>',
  cartera: '<path d="M3 7.5A2.5 2.5 0 015.5 5H18v4M3 7.5V17a2 2 0 002 2h14a2 2 0 002-2v-6a2 2 0 00-2-2H5.5A2.5 2.5 0 013 7.5z"/><circle cx="16.5" cy="14" r="1.2"/>',
  subir: '<path d="M12 16V5M7 10l5-5 5 5M5 19h14"/>' };
const ico = (n, c) => `<div class="ico" style="color:${c};background:color-mix(in srgb, ${c} 16%, transparent)"><svg viewBox="0 0 24 24">${ICO[n]}</svg></div>`;
const arte = (i) => ['linear-gradient(135deg,#0B2B4A,#1E7BFF 60%,#5CE1FF)', 'linear-gradient(135deg,#2A0B4A,#8F7BFF 55%,#FF7BD5)', 'linear-gradient(135deg,#06301E,#12B76A 55%,#39FF88)', 'linear-gradient(135deg,#3A1606,#FF8A3D 55%,#FFD23F)', 'linear-gradient(135deg,#0A1B3A,#3D5AFE 50%,#39FF88)'][i % 5];
const forma = i => ['<circle cx="50" cy="52" r="26" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="5"/><path d="M50 20v64M18 52h64" stroke="rgba(255,255,255,.4)" stroke-width="3"/>', '<path d="M20 78l30-56 30 56z" fill="rgba(255,255,255,.85)"/><path d="M36 78l14-26 14 26z" fill="rgba(4,6,11,.5)"/>', '<rect x="24" y="30" width="52" height="44" rx="12" fill="rgba(255,255,255,.88)"/><circle cx="40" cy="52" r="6" fill="#06301E"/><circle cx="62" cy="52" r="6" fill="#06301E"/>', '<path d="M50 18l9 22 24 2-18 15 6 24-21-13-21 13 6-24-18-15 24-2z" fill="rgba(255,255,255,.88)"/>', '<path d="M22 60c10-30 46-30 56 0M30 70h40" stroke="rgba(255,255,255,.88)" stroke-width="7" fill="none" stroke-linecap="round"/>'][i % 5];
const tarjeta = (padre, i, cat, tit, x, y, w, hh) => $('div', 'tar', `<div class="im" style="background:${arte(i)}"><svg viewBox="0 0 100 100" style="position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%)">${forma(i)}</svg><span class="on">● ONLINE</span></div><div class="ct">${cat}</div><div class="tt">${tit}</div>`, padre, `left:${x}px;top:${y}px;width:${w}px;height:${hh}px`);

/* ═══ 1 · Gancho (0 – 4,7) ═══ */
escena(0, 4.75, r => {
  const a = pal(r, 'Creaste algo increíble.', 'abs tit', 'left:0;right:0;top:350px;text-align:center;font-size:132px');
  const b = pal(r, 'Pero nadie lo ve.', 'abs tit', 'left:0;right:0;top:520px;text-align:center;font-size:132px;color:#5B6676');
  const c = $('div', 'abs mono', '0 vistas &nbsp;·&nbsp; 0 seguidores &nbsp;·&nbsp; $0', r, 'left:0;right:0;top:720px;text-align:center;font-size:30px;letter-spacing:.2em;color:#4A5361');
  sfx(.25, 'whoosh', .7); sfx(1.85, 'grave', .8); sfx(3.55, 'riser', 1);
  return { a, b, c };
}, (t, r, c) => {
  kin(c.a, t, .3); kin(c.b, t, 1.9, .09);
  c.c.style.opacity = en(t, 2.7, .5) * (.6 + .4 * Math.sin(t * 40) * (t < 3.2 ? 1 : 0));
  const k = en(t, 3.75, .95, E.in);   // todo se encoge hasta un punto de luz
  S(r, { o: win(t, 0, 4.75, .3, .12), s: 1 - k * .93, b: k * 14 });
});

/* ═══ 2 · Logo (4,6 – 9) ═══ */
escena(4.6, 9.1, r => {
  const on = [0, 1, 2].map(() => $('div', 'onda', null, r, 'left:960px;top:440px;width:300px;height:300px;margin:-150px 0 0 -150px'));
  const logo = $('img', 'abs', null, r, 'left:495px;top:262px;width:930px;filter:drop-shadow(0 0 60px rgba(57,255,136,.45))'); logo.src = 'logo.png';
  const linea = $('div', 'abs', null, r, 'left:460px;top:590px;width:1000px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#39FF88 25%,#5CE1FF 75%,transparent);box-shadow:0 0 24px rgba(57,255,136,.8)');
  const t1 = pal(r, 'La mejor plataforma del mundo', 'abs tit', 'left:0;right:0;top:640px;text-align:center;font-size:76px');
  const t2 = pal(r, 'para [desarrolladores] [independientes]', 'abs tit', 'left:0;right:0;top:736px;text-align:center;font-size:76px');
  golpe(4.72, 1); sfx(4.7, 'impacto', 1); sfx(6.0, 'whoosh', .6);
  return { on, logo, linea, t1, t2 };
}, (t, r, c) => {
  const k = en(t, 4.72, .9, E.spr);
  S(c.logo, { o: en(t, 4.72, .25), s: lerp(1.9, 1, k), b: (1 - en(t, 4.72, .5)) * 22 });
  c.on.forEach((o, i) => { const q = en(t, 4.74 + i * .16, 1.3); o.style.opacity = (1 - q) * .8; o.style.transform = `scale(${1 + q * 7})`; });
  c.linea.style.transform = `scaleX(${en(t, 5.3, .8, E.out5)})`;
  kin(c.t1, t, 5.75); kin(c.t2, t, 6.25);
  S(r, { o: win(t, 4.6, 9.1, .08, .45), s: 1 + (t - 4.6) * .008, y: -en(t, 8.65, .45, E.in) * 60 });
});

/* ═══ 3 · Tu vitrina (9 – 15,6) ═══ */
escena(8.9, 15.7, r => {
  const k = $('div', 'abs kick', 'Publica gratis', r, 'left:150px;top:118px');
  const t1 = pal(r, 'Tu vitrina, lista en [minutos.]', 'abs tit', 'left:150px;top:160px;font-size:88px');
  const nav = $('div', 'abs cristal filo', null, r, 'left:150px;top:300px;width:1620px;height:690px;transform-origin:50% 100%');
  $('div', 'nav-top', '<i></i><i></i><i></i><div class="nav-url">upgames.games</div>', nav);
  const cuerpo = $('div', 'abs', null, nav, 'left:0;right:0;top:64px;bottom:0');
  $('div', 'abs disp', '<span class="au">Up</span>Games', cuerpo, 'left:40px;top:30px;font-size:34px;letter-spacing:.06em');
  $('div', 'abs', 'Busca o pregúntale a Nexus…', cuerpo, 'left:300px;top:24px;width:900px;height:54px;border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);padding:13px 24px;font-size:20px;color:#6C7686');
  const pub = $('div', 'abs btn', 'Publicar', cuerpo, 'left:1330px;top:22px;width:250px;height:58px;font-size:18px');
  const chips = $('div', 'abs', ['Todos', 'Juegos', 'Mods', 'Apps', 'Videos', 'En vivo'].map((x, i) => `<span class="chipx${i ? '' : ' a'}">${x}</span>`).join(''), cuerpo, 'left:40px;top:108px;display:flex;gap:12px');
  const datos = [['JUEGO INDIE', 'Neon Drift'], ['MOD', 'Skyline HD Pack'], ['APP', 'FrameBoost'], ['JUEGO INDIE', 'Solar Keepers'], ['VIDEO', 'Devlog #12']];
  const ts = datos.map((d, i) => tarjeta(cuerpo, i, d[0], d[1], 40 + i * 310, 176, 290, 400));
  const nueva = tarjeta(cuerpo, 4, 'TU JUEGO', 'Publicado ✓', 40, 176, 290, 400); nueva.style.borderColor = 'rgba(57,255,136,.8)'; nueva.style.boxShadow = '0 0 60px rgba(57,255,136,.45)';
  nueva.querySelector('.im').style.background = 'linear-gradient(135deg,#052A1A,#39FF88 55%,#5CE1FF)';
  const onda = $('div', 'onda', null, cuerpo, 'left:1455px;top:51px;width:80px;height:80px;margin:-40px 0 0 -40px');
  const toast = $('div', 'abs', '<b style="color:#39FF88">✓</b>&nbsp; ¡Tu juego ya está en línea!', r, 'left:660px;top:910px;width:600px;text-align:center;padding:22px;border-radius:20px;background:rgba(9,13,22,.96);border:1.5px solid rgba(57,255,136,.5);font-size:28px;font-weight:600;box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 50px -10px rgba(57,255,136,.5)');
  sfx(9.0, 'whoosh', .8); [0, 1, 2, 3, 4].forEach(i => sfx(10.25 + i * .12, 'pop', .35)); sfx(12.75, 'clic', 1); sfx(12.85, 'campana', .8); golpe(12.8, .35);
  return { k, t1, nav, ts, nueva, pub, onda, toast };
}, (t, r, c) => {
  c.k.style.opacity = en(t, 9.1, .5); kin(c.t1, t, 9.25);
  const k = en(t, 9.2, 1.2, E.out5);
  c.nav.style.opacity = en(t, 9.2, .4);
  c.nav.style.transform = `perspective(2400px) translateY(${(1 - k) * 220}px) rotateX(${lerp(26, 0, k)}deg) scale(${lerp(.86, 1, k)})`;
  const pub = en(t, 12.8, .7, E.spr);   // al publicar, las tarjetas se corren y entra la nueva
  c.ts.forEach((el, i) => { const q = en(t, 10.2 + i * .12, .7, E.out5); S(el, { o: q * (i === 4 ? 1 - en(t, 12.8, .3) : 1), y: (1 - q) * 70, x: pub * 310, s: lerp(.92, 1, q) }); });
  S(c.nueva, { o: en(t, 12.8, .25), s: lerp(.5, 1, pub), y: (1 - pub) * -30 });
  // cursor: entra, va al botón Publicar y hace clic
  const m = en(t, 11.5, 1.15, E.io), cx = lerp(1000, 1620, m), cy = lerp(900, 425, m), clic = en(t, 12.7, .12) - en(t, 12.82, .2);
  cursor.style.opacity = win(t, 11.4, 13.7, .25, .3); cursor.style.transform = `translate(${cx}px, ${cy}px) scale(${1 - clic * .25})`;
  c.pub.style.transform = `scale(${1 - clic * .06})`; c.pub.style.filter = `brightness(${1 + en(t, 12.8, .1) * (1 - en(t, 12.9, .5)) * .5})`;
  const o = en(t, 12.8, .7); c.onda.style.opacity = (1 - o) * (t > 12.8 ? 1 : 0); c.onda.style.transform = `scale(${1 + o * 5})`;
  const tk = en(t, 13.0, .55, E.back); S(c.toast, { o: win(t, 13.0, 15.3, .25, .3), y: (1 - tk) * 60, s: lerp(.9, 1, tk) });
  S(r, { o: win(t, 8.9, 15.7, .35, .4), s: 1 + (t - 9) * .004, x: -en(t, 15.25, .45, E.in) * 140 });
});

/* ═══ 4 · Cómo ganas (15,5 – 23,3) ═══ */
escena(15.5, 23.4, r => {
