  Vista previa: video.html?t=12.5 (un instante) · video.html?play (tiempo real).
  Concepto «Convergencia»: la V del logotipo son dos caminos que se encuentran. Ver PREPRODUCCION.md.

<style>
@font-face { font-family: LvD; src: url(fuentes/InterDisplay-Black.otf); font-weight: 900; }

.pan img { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; }
.pan::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.04) 100%); }

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../../games/studio/lib/addons/environments/RoomEnvironment.js';

// ═══ Constantes de marca (cambiar aquí si cambia algo) ═══
const MARCA = 'Lurveta', TAGLINE = 'Donde todo converge.', DOMINIO = 'upgames.games', CTA = 'Explora gratis';
const VERDE = '#32D583', BLANCO = '#F2F5F4', ORO = '#F4C451';
const DURACION = 80, BPM = 120, TIEMPO = 60 / BPM;
const C = 'capturas/';

// ═══ Utilidades ═══
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const S = (t, a, b) => clamp((t - a) / (b - a));                       // rampa 0→1 entre a y b
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);                 // expo out
const ei = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);                 // expo in
const eio = k => k < .5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2; // quint in-out
const co = k => 1 - Math.pow(1 - k, 3);                                 // cubic out
const sio = k => -(Math.cos(Math.PI * k) - 1) / 2;                      // seno in-out
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ruido = (t, f = 8) => { const i = Math.floor(t * f), u = t * f - i, s = u * u * (3 - 2 * u); return lerp(hash(i), hash(i + 1), s) * 2 - 1; };
const $ = id => document.getElementById(id);
function el(tag, cls, css, padre, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (padre || $('dom')).appendChild(e); return e; }
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const precarga = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => { console.error('falta', src); ok(i); }; i.src = src; });

// Cortes de sonido que pide cada escena (audio.js los sintetiza en su instante)
const SFX = [];
const sfx = (t, tipo, g = 1, p = 0) => SFX.push({ t, tipo, g, p });

// ═══ Medidas reales de las capturas (capturar.js) ═══
let M = {};

// ═══ Ventana sobre una captura: muestra la región r=[x,y,w,h] (px de la captura) dentro de un panel w×h ═══
function ventana(src, w, h, radio, padre) {
  const p = el('div', 'pan', `width:${w}px;height:${h}px;border-radius:${radio}px`, padre);
  const im = el('img', '', '', p); im.src = src;
  const v = { p, im, w, h, src,
    tam(a, b) { v.w = a; v.h = b; p.style.width = a + 'px'; p.style.height = b + 'px'; },
    region(r) { const k = Math.max(v.w / r[2], v.h / r[3]); im.style.width = (IMGS[v.src].naturalWidth * k) + 'px'; im.style.transform = `translate(${-r[0] * k + (v.w - r[2] * k) / 2}px,${-r[1] * k + (v.h - r[3] * k) / 2}px)`; v.k = k; v.r = r; },
    // punto de la captura → coordenadas dentro del panel
    punto(x, y) { const r = v.r, k = v.k; return [(x - r[0]) * k + (v.w - r[2] * k) / 2, (y - r[1]) * k + (v.h - r[3] * k) / 2]; },
  };
  return v;
}
const mezclaR = (a, b, k) => a.map((x, i) => lerp(x, b[i], k));
const COMPLETA = [0, 0, 1170, 2532];

// ═══ Logo vectorial (las mismas rutas que public/icons/logo-lurveta.svg) ═══
let LOGO = null;   // { vb, paths:[{fill,d}] }
function svgLogo(css, partes = 'todo') {
  const [x, y, w, h] = LOGO.vb;
  const sel = LOGO.paths.filter((p, i) => partes === 'todo' || partes.includes(i));
  return `<svg viewBox="${x} ${y} ${w} ${h}" style="${css || ''}" xmlns="http://www.w3.org/2000/svg">${sel.map(p => `<path fill="${p.fill}" d="${p.d}"/>`).join('')}</svg>`;
}

// ═══ Three.js: la V y el logotipo extruidos ═══
let R3 = null;
function rutaAShapePath(d) {   // M H V L C Q Z absolutos (lo que escribe fontTools)
  const sp = new THREE.ShapePath(), tk = d.match(/[MHVLCQZ]|-?\d*\.?\d+(?:e-?\d+)?/gi); let i = 0, cx = 0, cy = 0, cmd = '';
  const n = () => parseFloat(tk[i++]);
  while (i < tk.length) {
    if (/[A-Z]/i.test(tk[i])) cmd = tk[i++];
    if (cmd === 'M') { cx = n(); cy = n(); sp.moveTo(cx, -cy); cmd = 'L'; }
    else if (cmd === 'L') { cx = n(); cy = n(); sp.lineTo(cx, -cy); }
    else if (cmd === 'H') { cx = n(); sp.lineTo(cx, -cy); }
    else if (cmd === 'V') { cy = n(); sp.lineTo(cx, -cy); }
    else if (cmd === 'C') { const a = n(), b = n(), c = n(), e = n(); cx = n(); cy = n(); sp.bezierCurveTo(a, -b, c, -e, cx, -cy); }
    else if (cmd === 'Q') { const a = n(), b = n(); cx = n(); cy = n(); sp.quadraticCurveTo(a, -b, cx, -cy); }
    else if (cmd === 'Z') { cmd = ''; }
    else i++;
  }
  return sp;
}
function iniciar3D() {
  const canvas = $('gl');
  const rd = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  rd.setPixelRatio(1); rd.setSize(1920, 1080, false); rd.setClearColor(0x000000, 0);
  rd.toneMapping = THREE.NeutralToneMapping; rd.toneMappingExposure = 1.0; rd.outputColorSpace = THREE.SRGBColorSpace;
  const esc = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(rd); esc.environment = pm.fromScene(new RoomEnvironment(), .04).texture; esc.environmentIntensity = .42;
  const cam = new THREE.PerspectiveCamera(24, 1920 / 1080, .1, 200);
  const luz = new THREE.DirectionalLight(0xffffff, 1.6); luz.position.set(-4, 6, 8); esc.add(luz);
  const borde = new THREE.DirectionalLight(0x9fffd0, 1.4); borde.position.set(6, -2, -6); esc.add(borde);
  const barrido = new THREE.PointLight(0xffffff, 0, 30, 1.4); esc.add(barrido);
  const grupo = new THREE.Group(); esc.add(grupo);
  const ESC = 1 / 1000, CX = 4884, CY = 667;   // centro del logotipo en unidades de fuente
  const matV = new THREE.MeshPhysicalMaterial({ color: VERDE, roughness: .38, metalness: 0, clearcoat: .7, clearcoatRoughness: .14, emissive: VERDE, emissiveIntensity: .12, transparent: true });
  const matB = new THREE.MeshPhysicalMaterial({ color: 0xE9EEEC, roughness: .4, metalness: 0, clearcoat: .7, clearcoatRoughness: .16, transparent: true });
  const piezas = LOGO.paths.map((p, idx) => {
    const formas = rutaAShapePath(p.d).toShapes(true);
    const geo = new THREE.ExtrudeGeometry(formas, { depth: 260, bevelEnabled: true, bevelThickness: 26, bevelSize: 16, bevelSegments: 3, curveSegments: 10 });
    geo.translate(-CX, CY, -130); geo.scale(ESC, ESC, ESC);
    const m = new THREE.Mesh(geo, (p.fill.toUpperCase() === VERDE ? matV : matB).clone());
    const pv = new THREE.Group(); pv.add(m); grupo.add(pv);
    return { pv, m, idx };
  });
  // 0-2: LUR · 3: V izquierda (verde) · 4: V derecha (blanca) · 5-7: ETA
  R3 = { rd, esc, cam, grupo, piezas, barrido, luz, VX: (4781 - CX) * ESC, VY: -(1490 - CY) * ESC };
}

// ═══ Escenas ═══
const ESCENAS = [];
function escena(a, b, crear, dibujar) { const raiz = el('div', 'esc'); const o = { a, b, raiz }; o.ctx = crear(raiz, o) || {}; o.dibujar = dibujar; ESCENAS.push(o); return o; }
let SACUDIDA = 0, FLASH = 0, NEGRO = 0, USA3D = false;

function construir() {
  const W = 1920, H = 1080;
  $('fondo').style.background = 'radial-gradient(70% 60% at 50% 45%, rgba(50,213,131,.055), rgba(0,0,0,0) 70%), #070B0A';

  // ─────────────── ACTO I · EVOLUCIÓN ───────────────
  // 1 · Memoria: el logotipo de UpGames, como un recuerdo
  escena(0, 4.4, r => {
    const viejo = el('div', 'a', `left:${W / 2 - 520}px;top:${H / 2 - 167}px;width:1040px;height:334px`, r);
    const up = el('div', 'a', `inset:0;background:url(recursos/upgames-logo-antiguo.png) 0 0/1040px 334px no-repeat;clip-path:inset(0 61% 0 0)`, viejo);
    const tiras = [];
    for (let k = 0; k < 14; k++) tiras.push(el('div', 'a', `left:0;top:${k * 334 / 14}px;width:1040px;height:${334 / 14 + .5}px;background:url(recursos/upgames-logo-antiguo.png) 0 ${-k * 334 / 14}px/1040px 334px no-repeat;clip-path:inset(0 0 0 39%)`, viejo));
    return { viejo, up, tiras };
  }, (t, c) => {
    const ent = S(t, .5, 2.2), parp = t < 2.2 ? (hash(Math.floor(t * 30)) > .82 - ent * .5 ? 1 : .35) : 1;
    const sal = S(t, 3.6, 4.4);
    c.viejo.style.opacity = eo(ent) * parp * (1 - sal);
    c.viejo.style.filter = `grayscale(${.75 - .35 * S(t, 2, 3.4)}) brightness(${.7 + .25 * S(t, 1, 3)}) blur(${(1 - eo(ent)) * 6}px)`;
    c.viejo.style.transform = `scale(${1.04 - .04 * co(S(t, .5, 4))})`;
    c.tiras.forEach((e, k) => { const d = S(t, 3.5 + k * .018, 4.15 + k * .018); e.style.transform = `translateX(${eo(d) * (hash(k + 3) > .5 ? 1 : -1) * (180 + hash(k) * 420)}px)`; e.style.opacity = 1 - d; });
  });
  sfx(.5, 'zumbido', .8); sfx(1.1, 'chispa', .5); sfx(1.65, 'chispa', .4); sfx(3.5, 'corte', .9);

  // 2 · Ascenso: queda la flecha de «Up», sube; tres palabras al compás
  escena(3.4, 8.15, r => {
    const fl = el('div', 'a', `left:${W / 2 - 60}px;top:${H / 2 - 110}px;width:120px;height:220px`, r,
      `<svg viewBox="0 0 120 220" width="120" height="220" style="overflow:visible;filter:drop-shadow(0 0 14px rgba(94,255,67,.7))">
        <path d="M60 6 L112 62 L80 62 L80 214 L40 214 L40 62 L8 62 Z" fill="none" stroke="#5EFF43" stroke-width="5" stroke-linejoin="round"/>
        <path d="M60 70 V150 M60 150 L46 166 V196 M60 112 L74 126 V182" fill="none" stroke="#5EFF43" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="46" cy="200" r="5" fill="none" stroke="#5EFF43" stroke-width="3"/><circle cx="74" cy="186" r="5" fill="none" stroke="#5EFF43" stroke-width="3"/><circle cx="60" cy="70" r="5" fill="#5EFF43"/></svg>`);
    const barra = el('div', 'a', `left:${W / 2 - 22}px;top:${H / 2 - 330}px;width:44px;height:660px;background:${BLANCO};border-radius:4px;box-shadow:0 0 60px rgba(255,255,255,.45)`, r);
    const pal = ['Crecimos.', 'Cambiamos.', 'Evolucionamos.'].map((w, k) => el('div', 'd a', `font-size:${[150, 150, 150][k]}px;left:0;top:0;color:${BLANCO}`, r, w));
    return { fl, barra, pal };
  }, (t, c) => {
    // la flecha aparece donde estaba en el logo (lado izquierdo) y sube al centro
    const k1 = eio(S(t, 3.7, 5.2)), sube = eio(S(t, 4.4, 7.4));
    const x = lerp(-300, 0, k1), y = lerp(10, -60, k1) - 90 * sube;
    const rot = 18 * eio(S(t, 6.6, 7.6)), esc = 1.7 + 1.2 * eio(S(t, 6.2, 7.5));
    const morf = S(t, 7.35, 7.75);
    c.fl.style.opacity = S(t, 3.55, 3.9) * (1 - morf);
    c.fl.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${esc})`;
    c.barra.style.opacity = morf * (1 - S(t, 7.95, 8.02));   // le pasa el relevo al trazo 3D en el destello
    c.barra.style.transform = `translate(${x + 40 * morf}px,${y + 60}px) rotate(${rot}deg) scaleY(${lerp(.35, 1, eo(morf))}) scaleX(${lerp(.6, 1, morf)})`;
    c.barra.style.boxShadow = `0 0 ${60 + 80 * S(t, 7.6, 8)}px rgba(255,255,255,${.35 + .4 * S(t, 7.6, 8)})`;
    // palabras: entran en su tiempo, se van empujadas por la siguiente
    const T = [4.5, 5.5, 6.5], POS = [[180, 210], [990, 470], [300, 760]];
    c.pal.forEach((e, k) => {
      const e1 = S(t, T[k] - .06, T[k] + .35), e2 = S(t, T[k] + .82, T[k] + 1.02);
      e.style.left = POS[k][0] + 'px'; e.style.top = POS[k][1] + 'px';
      e.style.opacity = eo(e1) * (1 - e2) * .96;
      e.style.transform = `translateY(${(1 - eo(e1)) * 70}px) skewX(${-8 * (1 - eo(e1))}deg)`;
      e.style.filter = `blur(${(1 - eo(e1)) * 14 + e2 * 18}px)`;
      e.style.clipPath = `inset(${(1 - eo(e1)) * 100}% 0 0 0)`;
    });
  });
  sfx(4.5, 'golpeSeco', .8); sfx(5.5, 'golpeSeco', .85); sfx(6.5, 'golpeSeco', .9); sfx(6.0, 'riser', 1); sfx(7.4, 'brillo', .6);

  // 3 · Encuentro y revelación (3D): el trazo verde llega; nacen la V y LURVETA
  escena(7.75, 12.25, r => {
    const halo = el('div', 'a', `left:${W / 2 - 700}px;top:${H / 2 - 700}px;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle, rgba(50,213,131,.30), rgba(50,213,131,0) 60%)`, r);
    const onda = el('div', 'a', `left:${W / 2}px;top:${H / 2}px;width:10px;height:10px;border-radius:50%;border:2px solid rgba(220,255,236,.9)`, r);
    return { halo, onda };
  }, (t, c, o) => {
    USA3D = true;
    const { cam, piezas, grupo, barrido } = R3;
    const golpe = 8.0, k = S(t, golpe, golpe + 4.2);
    // cámara: frente a la V, gira hacia el logotipo completo
    const giro = lerp(-.62, .06, eio(S(t, 8.0, 11.2))), dist = lerp(9.2, 15.5, eio(S(t, 8.4, 11.6)));
    cam.position.set(Math.sin(giro) * dist + R3.VX * (1 - S(t, 8.4, 11)), lerp(.2, .35, k), Math.cos(giro) * dist); cam.lookAt(lerp(R3.VX, 0, eio(S(t, 8.4, 11))), lerp(-.2, 0, eio(S(t, 8.4, 11))), 0);
    grupo.rotation.set(0, 0, 0); grupo.position.set(0, 0, 0);
    piezas.forEach(({ pv, m, idx }) => {
      m.material.opacity = 1; pv.visible = true; pv.position.set(0, 0, 0); pv.rotation.set(0, 0, 0); pv.scale.set(1, 1, 1);
      if (idx === 4) {                                   // trazo blanco: ya estaba (la flecha)
        m.material.opacity = S(t, 7.93, 8.0);   // aparece bajo el destello del choque
      } else if (idx === 3) {                            // trazo verde: entra desde abajo a la izquierda y choca
        const e = ei(S(t, 7.82, golpe));
        pv.position.set(lerp(-5.5, 0, e), lerp(-9, 0, e), 0); m.material.opacity = S(t, 7.93, 7.97);
      } else {                                           // LUR y ETA salen de detrás de la V
        const orden = idx < 3 ? 2 - idx : idx - 5, e = eo(S(t, 9.0 + orden * .16, 10.2 + orden * .16));
        pv.position.set(0, -(1 - e) * 1.5, -(1 - e) * 1.6);   // suben desde abajo, de la V hacia fuera
        m.material.opacity = S(t, 9.0 + orden * .16, 9.55 + orden * .16);
      }
    });
    // barrido de luz por el logotipo
    barrido.intensity = 26 * Math.sin(Math.PI * S(t, 10.4, 12.1)); barrido.position.set(lerp(-7, 7, sio(S(t, 10.4, 12.1))), 1.4, 3.2);
    // destello y onda del choque
    const ch = S(t, golpe, golpe + .9);
    c.halo.style.opacity = (t >= golpe ? 1 - S(t, golpe, golpe + 2.4) : 0) * .9;
    c.onda.style.opacity = t >= golpe ? (1 - ch) : 0;
    const rad = eo(ch) * 1300; c.onda.style.transform = `translate(-50%,-50%) translate(${0}px,${150}px)`; c.onda.style.width = c.onda.style.height = rad + 'px'; c.onda.style.left = W / 2 - 40 + 'px'; c.onda.style.top = H / 2 + 60 + 'px'; c.onda.style.borderWidth = (3 * (1 - ch) + .5) + 'px';
    FLASH = Math.max(FLASH, t >= 7.97 ? .5 * (1 - S(t, golpe, golpe + .28)) : 0);
    SACUDIDA = Math.max(SACUDIDA, t >= golpe ? 14 * (1 - S(t, golpe, golpe + .5)) : 0);
    // salida: el logotipo se aleja hacia el tipo de la siguiente escena
    $('gl').style.opacity = 1 - S(t, 11.85, 12.15);
  });
  sfx(7.75, 'silencio', 1); sfx(8.0, 'impacto', 1.15); sfx(8.0, 'motivo', 1); sfx(9.0, 'whoosh', .6); sfx(10.4, 'brillo', .8);

  // 4 · «UpGames ahora es» → LURVETA a pantalla completa → entrar por el vértice
  escena(12.0, 16.08, r => {
    const viejo = el('div', 'd a', `font-size:190px;color:rgba(242,245,244,.42);left:0;right:0;top:300px;text-align:center`, r, 'UpGames');
    const tacha = el('div', 'linea', `left:${W / 2 - 470}px;top:398px;width:940px`, r);
    const ahora = el('div', 't a', `font-size:46px;color:rgba(242,245,244,.8);left:0;right:0;top:560px;text-align:center`, r, 'ahora es');
    const logo = el('div', 'a', `left:${W / 2 - 860}px;top:${H / 2 - 147}px;width:1720px;height:294px;transform-origin:${4810 / 9768 * 1720}px ${(900 + 179) / 1669 * 294}px`, r, svgLogo('width:1720px;height:294px;display:block'));

// ═══ Grano de película (8 cuadros de ruido precalculados) ═══
const GRANOS = [];
function prepararGrano() {
  for (let k = 0; k < 8; k++) {
    const c = document.createElement('canvas'); c.width = 1040; c.height = 600; const x = c.getContext('2d'), d = x.createImageData(1040, 600);
    let s = 1234 + k * 777; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd() + rnd() + rnd() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); GRANOS.push(c);
  }
}

// ═══ Dibujar un instante ═══
const IMGS = {};
function render(t) {
  SACUDIDA = 0; FLASH = 0; NEGRO = 0; USA3D = false;
  $('cam').style.transform = 'none'; $('gl').style.opacity = 1;
  for (const e of ESCENAS) {
    const dentro = t >= e.a && t < e.b;
    e.raiz.style.display = dentro ? 'block' : 'none';
    if (dentro) e.dibujar(t, e.ctx, e);
  }
  if (R3) { R3.rd.domElement.style.display = USA3D ? 'block' : 'none'; if (USA3D) R3.rd.render(R3.esc, R3.cam); }
  // cámara: sacudida de los golpes
  if (SACUDIDA > 0) { const base = $('cam').style.transform === 'none' ? '' : $('cam').style.transform; $('cam').style.transform = `translate(${ruido(t, 40) * SACUDIDA}px,${ruido(t + 9, 40) * SACUDIDA}px) ${base}`; }
  $('flash').style.opacity = FLASH; $('negro').style.opacity = clamp(NEGRO);
  const g = $('grano').getContext('2d'), f = Math.floor(t * 30);
  g.drawImage(GRANOS[f % 8], 0, 0); $('grano').style.transform = `translate(${(hash(f) - .5) * 60}px,${(hash(f + 3) - .5) * 60}px)`;
}

window.listo = (async () => {

  await Promise.all(lista.map(async s => { IMGS[s] = await precarga(s); }));
  await precarga('recursos/upgames-logo-antiguo.png');
  await document.fonts.load('900 100px LvD'); await document.fonts.load('700 100px LvD'); await document.fonts.load('500 40px LvT'); await document.fonts.load('600 40px LvT');
  prepararGrano(); iniciar3D(); construir();
  window.DURACION = DURACION; window.SFX = SFX.sort((a, b) => a.t - b.t); window.render = render;

  if (q.has('t')) render(+q.get('t'));

  return true;
})();
