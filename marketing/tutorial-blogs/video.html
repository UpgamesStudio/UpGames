<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lurveta Blogs · Tutorial</title>
<!--
  Tutorial «Crea tu propia página web con Lurveta» · 1920×1080 · 30 fps.
  La línea de tiempo la manda la locución: tiempos.json (narracion.py) dice cuándo empieza y termina cada frase,
  y cada escena se coloca sobre sus frases. render(t) dibuja cada fotograma de forma exacta (render.js lo graba).
  Todas las interfaces son capturas del flujo real (grabar.js). Vista previa: video.html?t=30 · video.html?play
-->
<style>
@font-face { font-family: LvD; src: url(../lanzamiento/fuentes/InterDisplay-Black.otf); font-weight: 900; }
@font-face { font-family: LvD; src: url(../lanzamiento/fuentes/InterDisplay-Bold.otf); font-weight: 700; }
@font-face { font-family: LvT; src: url(../lanzamiento/fuentes/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: LvT; src: url(../lanzamiento/fuentes/Inter-SemiBold.otf); font-weight: 600; }
:root { --papel: #F2F0EB; --tinta: #121715; --tinta2: #5B6561; --verde: #17A866; --verdeV: #32D583; --violeta: #7C5CFF; --violeta2: #B8A6FF; }
html, body { margin: 0; background: #000; overflow: hidden; }
#s { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--papel); font-family: LvT, sans-serif; color: var(--tinta); }
#fondo { position: absolute; inset: 0;
  background: radial-gradient(65% 60% at 50% 40%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
              radial-gradient(circle, rgba(18,23,21,.075) 1.2px, transparent 1.4px) 0 0 / 28px 28px, var(--papel); }
.esc { position: absolute; inset: 0; display: none; }
.a { position: absolute; }
.d { font-family: LvD; font-weight: 900; letter-spacing: -.04em; line-height: .95; white-space: nowrap; }
.d7 { font-family: LvD; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
.t { font-family: LvT; font-weight: 500; letter-spacing: -.01em; }
/* Panel con una captura real; la cámara elige qué región se ve */
.pan { position: absolute; overflow: hidden; background: #0A0F0D; border-radius: 22px;
  box-shadow: 0 50px 110px -40px rgba(18,23,21,.55), 0 18px 40px -20px rgba(18,23,21,.35), 0 0 0 1px rgba(18,23,21,.10); }
.pan img { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; }
.aro { position: absolute; border-radius: 16px; box-shadow: 0 0 0 3px var(--verdeV), 0 0 0 9px rgba(50,213,131,.22), 0 0 40px rgba(50,213,131,.55); pointer-events: none; }
.aro.nx { box-shadow: 0 0 0 3px var(--violeta2), 0 0 0 9px rgba(124,92,255,.25), 0 0 46px rgba(124,92,255,.6); }
.globo { position: absolute; padding: 12px 20px; border-radius: 14px; background: var(--tinta); color: #fff; font: 600 26px/1.2 LvT; white-space: nowrap; box-shadow: 0 16px 34px -14px rgba(0,0,0,.5); }
.globo.v { background: var(--verde); }
.globo.nx { background: var(--violeta); }
.globo.lado::after { display: none; }
.globo::after { content: ''; position: absolute; left: 26px; bottom: -9px; border: 10px solid transparent; border-bottom: 0; border-top-color: inherit; border-top-color: var(--c, var(--tinta)); }
/* Paso actual */
#paso { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 16px; opacity: 0; }
#paso .n { width: 52px; height: 52px; border-radius: 16px; background: var(--tinta); color: #fff; display: grid; place-items: center; font: 900 26px/1 LvD; }
#paso .tx b { display: block; font: 700 30px/1.1 LvD; letter-spacing: -.02em; color: var(--tinta); }
#paso .tx small { font: 600 18px/1.2 LvT; color: var(--tinta2); letter-spacing: .08em; text-transform: uppercase; }
#puntos { position: absolute; right: 64px; top: 72px; display: flex; gap: 8px; opacity: 0; }
#puntos i { width: 34px; height: 6px; border-radius: 6px; background: rgba(18,23,21,.15); }
#puntos i.on { background: var(--verde); }
/* Subtítulos */
#sub { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: 1500px; padding: 14px 28px 16px; border-radius: 18px;
  background: rgba(18,23,21,.88); color: #fff; font: 600 34px/1.32 LvT; letter-spacing: -.005em; text-align: center; opacity: 0;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 18px 40px -18px rgba(0,0,0,.5); }
/* Cursor */
#cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; pointer-events: none; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
#clic { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid var(--verdeV); opacity: 0; z-index: 49; pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#negro { position: absolute; inset: 0; background: #0A0F0D; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="s">
  <div id="fondo"></div>
  <div id="dom" class="a" style="inset:0"></div>
  <div id="paso"><div class="n">1</div><div class="tx"><small>Paso 1 de 7</small><b>Crea tu blog</b></div></div>
  <div id="puntos"></div>
  <div id="clic"></div>
  <svg id="cursor" viewBox="0 0 32 32"><path d="M6 3 L6 25 L11.5 19.6 L15.4 28.4 L19 26.8 L15.2 18.2 L23 18.2 Z" fill="#fff" stroke="#121715" stroke-width="1.8" stroke-linejoin="round"/></svg>
  <div id="sub"></div>
  <div id="flash"></div>
  <div id="negro"></div>
</div>
<script>
// ═══ Constantes (cambiar aquí) ═══
const DOMINIO = 'lurveta.com', LEMA = ['Tu espacio.', 'Tus ideas.', 'Tu contenido.'];
const C = 'capturas/';
// ═══ Utilidades ═══
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const S = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eio = k => k < .5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
const sio = k => -(Math.cos(Math.PI * k) - 1) / 2;
const co = k => 1 - Math.pow(1 - k, 3);
const $ = id => document.getElementById(id);
function el(tag, cls, css, padre, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (padre || $('dom')).appendChild(e); return e; }
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const mezclaR = (a, b, k) => a.map((x, i) => lerp(x, b[i], k));
const IMGS = {};
let M = {}, T = {}, DUR = 100;

// Panel con una captura: region(r) = qué parte (px de la captura) se ve; punto(x,y) = de la captura a la pantalla
function panel(src, padre) {
  const p = el('div', 'pan', '', padre), im = el('img', '', '', p); im.src = src;
  const v = { p, im, src, x: 0, y: 0, w: 100, h: 100, k: 1, r: [0, 0, 1, 1],
    pon(x, y, w, h) { v.x = x; v.y = y; v.w = w; v.h = h; st(p, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); },
    cambia(s) { if (v.src !== s) { v.src = s; im.src = s; } },
    region(r) { const k = Math.max(v.w / r[2], v.h / r[3]); im.style.width = IMGS[v.src].naturalWidth * k + 'px'; v.k = k; v.r = r;
      im.style.transform = `translate(${-r[0] * k + (v.w - r[2] * k) / 2}px,${-r[1] * k + (v.h - r[3] * k) / 2}px)`; },
    punto(x, y) { const r = v.r, k = v.k; return [v.x + (x - r[0]) * k + (v.w - r[2] * k) / 2, v.y + (y - r[1]) * k + (v.h - r[3] * k) / 2]; },
    caja(b) { const [x, y] = v.punto(b[0], b[1]), [x2, y2] = v.punto(b[0] + b[2], b[1] + b[3]); return [x, y, x2 - x, y2 - y]; },
  };
  return v;
}
const PANT = [0, 0, 2880, 1800];
const m = (cap, k) => M[cap]?.[k];
const centro = b => [b[0] + b[2] / 2, b[1] + b[3] / 2];

// Aro de resaltado en coordenadas de pantalla
function aro(e, b, vis, pad = 10, radio = 16) { if (!b) { e.style.opacity = 0; return; } st(e, { left: b[0] - pad + 'px', top: b[1] - pad + 'px', width: b[2] + pad * 2 + 'px', height: b[3] + pad * 2 + 'px', borderRadius: radio + 'px', opacity: vis }); }
function globo(e, x, y, vis) { st(e, { left: x + 'px', top: y - 70 + 'px', opacity: vis, transform: `translateY(${(1 - vis) * 12}px)` }); }

// ═══ Cursor: recorrido por puntos { t, x, y, clic } ═══
let CURSOR = null, CLIC = null;
function cursor(t, pts) {
  if (!pts.length) return;
  let a = pts[0], b = pts[0];
  for (let i = 0; i < pts.length; i++) { if (pts[i].t <= t) { a = pts[i]; b = pts[i + 1] || pts[i]; } }
  if (t < pts[0].t) b = a;
  const k = b === a ? 1 : eio(S(t, a.t, b.t - .05));
  CURSOR = [lerp(a.x, b.x, k), lerp(a.y, b.y, k), Math.min(1, S(t, pts[0].t - .3, pts[0].t))];
  for (const p of pts) if (p.clic && t >= p.t && t < p.t + .5) CLIC = [p.x, p.y, S(t, p.t, p.t + .5)];
}

// ═══ Escenas ═══
const ESCENAS = [];
function escena(nombre, a, b, crear, dibujar) { const raiz = el('div', 'esc'); const o = { nombre, a, b, raiz }; o.c = crear(raiz) || {}; o.dibujar = dibujar; ESCENAS.push(o); return o; }
const PASOS = { crear: [1, 'Crea tu blog'], nexus: [2, 'Tu página con Nexus'], editar: [3, 'Edita y completa'], publicar: [4, 'Revisa y publica'], marca: [5, 'Tu marca'], entrada: [6, 'Escribe con ayuda'], resultado: [7, 'Comparte tu sitio'] };
// Sonidos que pide la imagen (audio.js): clics, teclas, transiciones…
const SFX = []; const sfx = (t, tipo, g = 1) => SFX.push({ t: +t.toFixed(3), tipo, g });
let FLASH = 0, NEGRO = 0;

function construir() {
  const W = 1920, H = 1080;
  const ini = id => T[id].inicio, fin = id => T[id].fin;
  const PX = 240, PY = 128, PW = 1440, PH = 742;   // panel estándar (16:10, como las capturas)

  // ── 1 · El problema ──
  const b1 = ini('entrar') - .3;
  escena('problema', 0, b1, r => {
    const codigo = ['<!DOCTYPE html>', '<head><meta name="viewport"…', '.hero { display: grid; }', 'npm install', 'git push origin main', 'DNS · registro A', '@media (max-width: 768px)', 'const app = express()', 'SSL · certificado', '</html>'];
    const cod = codigo.map((c, i) => el('div', 'a t', `font:500 30px/1 'DejaVu Sans Mono',monospace;color:rgba(18,23,21,.55);white-space:nowrap`, r, c));
    const q = el('div', 'd a', `left:0;right:0;top:330px;text-align:center;font-size:118px;color:var(--tinta)`, r, '¿Tu propio espacio<br>en internet?');
    const sin = el('div', 'd a', `left:0;right:0;top:600px;text-align:center;font-size:76px;color:var(--verde)`, r, 'Sin programar.');
    const pg = panel('../lanzamiento/capturas/d-blog.webp', r);
    return { cod, q, sin, pg };
  }, (t, c) => {
    const POS = [[150, 170], [1290, 150], [220, 820], [1430, 820], [90, 500], [1500, 480], [480, 120], [1080, 900], [260, 650], [1300, 650]];
    const disper = eio(S(t, 4.3, 5.6));
    c.cod.forEach((e, i) => {
      const ap = eo(S(t, .3 + i * .18, .9 + i * .18)), [x, y] = POS[i];
      const dx = (x - W / 2) * disper * 1.6, dy = (y - H / 2) * disper * 1.6;
      st(e, { left: x + dx + 'px', top: y + dy + Math.sin(t * 1.3 + i) * 6 + 'px', opacity: ap * (1 - disper), filter: `blur(${disper * 6}px)` });
    });
    const q = eo(S(t, .9, 1.7)); st(c.q, { opacity: q * (1 - S(t, 5.4, 5.9)), transform: `translateY(${(1 - q) * 40 - S(t, 5.4, 5.9) * 30}px)` });
    const s = eo(S(t, 4.4, 5.0)); st(c.sin, { opacity: s * (1 - S(t, 5.4, 5.9)), transform: `scale(${lerp(.9, 1, s)})` });
    // la herramienta real: Lurveta Blogs
    const e = eo(S(t, 5.6, 6.6)); c.pg.pon(PX, PY, PW, PH); c.pg.region([0, 0, 1920, 1080]);
    st(c.pg.p, { opacity: S(t, 5.6, 5.9), transform: `translateY(${(1 - e) * 120}px) scale(${lerp(.94, 1, e)})` });
  });
  sfx(.9, 'entrada', .7); sfx(4.4, 'swoosh', .8); sfx(5.6, 'aparece', .9);

  // ── 2 · Entrar a Blogs ──
  const b2 = ini('nombre') - .35;
  escena('entrar', b1, b2, r => {
    const pt = panel(C + '00-portada.webp', r); const a1 = el('div', 'aro', '', r); const g = el('div', 'globo v', '--c:var(--verde)', r, 'Mi blog');
    return { pt, a1, g };
  }, (t, c) => {
    const t0 = b1, clicOrbe = t0 + 1.0, clicBlog = t0 + 2.1;
    c.pt.cambia(C + (t < clicOrbe + .15 ? '00-portada.webp' : '00-menu.webp'));
    const z = eio(S(t, t0 + .2, clicOrbe));   // la cámara se acerca a la esquina del menú
    c.pt.pon(PX, PY, PW, PH); c.pt.region(mezclaR(PANT, [1500, 0, 1380, 862], z));
    st(c.pt.p, { opacity: S(t, t0, t0 + .25) });
    const orbe = c.pt.caja(m('00-menu', 'orbe')), blog = c.pt.caja(m('00-menu', 'blog'));
    cursor(t, [{ t: t0 + .2, x: 1100, y: 700 }, { t: clicOrbe, x: centro(orbe)[0], y: centro(orbe)[1], clic: 1 }, { t: clicBlog, x: centro(blog)[0], y: centro(blog)[1], clic: 1 }, { t: b2, x: centro(blog)[0], y: centro(blog)[1] }]);
    aro(c.a1, blog, S(t, clicBlog - .35, clicBlog - .1), 8, 999);
    globo(c.g, blog[0] - 40, blog[1] - 10, S(t, clicBlog - .35, clicBlog - .1));
    FLASH = Math.max(FLASH, .7 * S(t, b2 - .25, b2));
  });
  sfx(b1 + 1.0, 'clic'); sfx(b1 + 1.05, 'abre', .7); sfx(b1 + 2.1, 'clic');

  // ── 3 · Crear el blog ──
  const b3 = ini('nexus1') - .35;
  escena('crear', b2, b3, r => {
    const pa = panel(C + '01-asistente.webp', r), a1 = el('div', 'aro', '', r), g1 = el('div', 'globo v lado', '--c:var(--verde)', r, '✓ Dirección disponible');
    const tapa = el('div', 'a', 'background:#1B2020', pa.p);
    return { pa, a1, g1, tapa };
  }, (t, c) => {
    const tN = ini('nombre'), tT = ini('tema'), tA = ini('acepto');
    // fotogramas reales del asistente según el momento
    const src = t < tN + .2 ? '01-asistente' : t < tN + 2.6 ? '02-nombre' : t < tT + 1.2 ? '03-descripcion' : t < tA ? '04-tema' : t < tA + 2.6 ? '05-acepto' : '06-panel';
    c.pa.cambia(C + src + '.webp');
    c.pa.pon(PX, PY, PW, PH);
    // cámara: formulario de cerca mientras se escribe; temas; aceptar; panel
    const rForm = [700, 300, 1480, 925], rTemas = [800, 1060, 1280, 800], rAcep = [800, 1180, 1280, 800];
    let r = rForm;
    if (src === '04-tema') r = mezclaR(rForm, rTemas, eio(S(t, tT + 1.2, tT + 2.0)));
    if (src === '05-acepto') r = rAcep;
    if (src === '06-panel') r = mezclaR(rAcep, PANT, eio(S(t, tA + 2.6, tA + 3.2)));
    c.pa.region(r); st(c.pa.p, { opacity: S(t, b2, b2 + .25) });
    // escritura del nombre: la captura con el nombre se revela de izquierda a derecha
    const nom = m('02-nombre', 'nombre'), kN = S(t, tN + .25, tN + 1.8);
    if (src === '02-nombre' && kN < 1) { const [x, y] = [ (nom[0] + 40 + kN * 700 - c.pa.r[0]) * c.pa.k + (c.pa.w - c.pa.r[2] * c.pa.k) / 2, (nom[1] + 10 - c.pa.r[1]) * c.pa.k + (c.pa.h - c.pa.r[3] * c.pa.k) / 2 ];
      st(c.tapa, { left: x + 'px', top: y + 'px', width: Math.max(0, (nom[0] + nom[2] - 20 - (nom[0] + 40 + kN * 700))) * c.pa.k + 'px', height: (nom[3] - 20) * c.pa.k + 'px', opacity: 1 }); } else c.tapa.style.opacity = 0;
    const nota = c.pa.caja(m('02-nombre', 'nota'));
    const gv = S(t, tN + 2.0, tN + 2.3) * (1 - S(t, tN + 4.6, tN + 4.9));
    aro(c.a1, [nota[0], nota[1], 250, nota[3]], gv, 8, 12); globo(c.g1, nota[0] + 300, nota[1] + nota[3] / 2 + 42, gv);
    // cursor: campo nombre → descripción → tema Gamer → aceptar → Crear mi blog
    const P = (cap, k) => { const b = c.pa.caja(m(cap, k)); return centro(b); };
    const pts = [{ t: tN - .2, x: 900, y: 760 }, { t: tN + .15, x: P('02-nombre', 'nombre')[0] - 300, y: P('02-nombre', 'nombre')[1], clic: 1 }];
    if (t > tT - .3) pts.push({ t: tT, x: P('03-descripcion', 'desc')[0] - 300, y: P('03-descripcion', 'desc')[1], clic: 1 });
    if (src === '04-tema' || t >= tA) { const g = c.pa.caja(m('04-tema', 'gamer')); pts.push({ t: tT + 2.2, x: centro(g)[0], y: centro(g)[1], clic: 1 }); }
    if (t >= tA) { pts.push({ t: tA + .6, x: c.pa.caja(m('05-acepto', 'acepto'))[0] + 24, y: c.pa.caja(m('05-acepto', 'acepto'))[1] + 26, clic: 1 }); pts.push({ t: tA + 2.2, x: P('05-acepto', 'crear')[0], y: P('05-acepto', 'crear')[1], clic: 1 }); }
    cursor(t, pts);
  });
  sfx(ini('nombre') + .15, 'clic'); for (let k = 0; k < 14; k++) sfx(ini('nombre') + .25 + k * .11, 'tecla', .5);
  sfx(ini('nombre') + 2.0, 'ok', .8); sfx(ini('tema'), 'clic'); for (let k = 0; k < 10; k++) sfx(ini('tema') + .1 + k * .1, 'tecla', .45);
  sfx(ini('tema') + 2.2, 'clic'); sfx(ini('acepto') + .6, 'clic'); sfx(ini('acepto') + 2.2, 'clic'); sfx(ini('acepto') + 2.6, 'exito', .8);

  // ── 4 · Página con Nexus ──
  const b4 = ini('editar') - .35;
  escena('nexus', b3, b4, r => {
    const pa = panel(C + '06-panel.webp', r), a1 = el('div', 'aro', '', r), a2 = el('div', 'aro nx', '', r), g2 = el('div', 'globo nx', '--c:var(--violeta)', r, '✦ Que Nexus la cree');
    const etqs = ['Portada', 'Beneficios', 'Opiniones', 'Preguntas frecuentes', 'Llamada a la acción'].map(n => el('div', 'globo nx', '--c:var(--violeta)', r, n));
    const cel = panel(C + '14-previa-landing.webp', r), comp = panel(C + '15-previa-computador.webp', r);
    const tapa = el('div', 'a', 'background:#1B2020', pa.p);
    return { pa, a1, a2, g2, etqs, cel, comp, tapa };
  }, (t, c) => {
    const t1 = ini('nexus1'), t2 = ini('nexus2'), t3 = ini('nexus3'), tP = ini('previa');
    const src = t < t1 + 1.1 ? '07-paginas' : t < t1 + 2.6 ? '08-como-empezar' : t < t2 + .3 ? '09-nexus-vacio' : t < t2 + 2.5 ? '10-nexus-lleno' : t < t3 + .7 ? '11-nexus-pensando' : '13-landing-completa';
    c.pa.cambia(C + src + '.webp'); c.pa.pon(PX, PY, PW, PH);
    // cámara
    let r = PANT;
    if (src === '08-como-empezar') r = mezclaR(PANT, [700, 420, 1480, 925], eio(S(t, t1 + 1.1, t1 + 1.5)));
    if (src === '09-nexus-vacio' || src === '10-nexus-lleno' || src === '11-nexus-pensando') r = [700, 420, 1480, 925];
    if (src === '13-landing-completa') { const k = sio(S(t, t3 + 1.0, tP - .2)); r = [560, lerp(140, 4900, k), 1760, 1100]; }
    c.pa.region(r); st(c.pa.p, { opacity: tP > t ? 1 : 1 - S(t, tP, tP + .35) });
    // nueva página (+) y «Que Nexus la cree»

  FLASH = 0; NEGRO = 0; CURSOR = null; CLIC = null;
  let actual = null;
  for (const e of ESCENAS) { const dentro = t >= e.a && t < e.b; e.raiz.style.display = dentro ? 'block' : 'none'; if (dentro) { e.dibujar(t, e.c, e); actual = e; } }
  // paso
  const ps = actual && PASOS[actual.nombre], pv = ps ? clamp(Math.min(S(t, actual.a, actual.a + .4), 1 - S(t, actual.b - .25, actual.b))) : 0;
  if (ps) { $('paso').querySelector('.n').textContent = ps[0]; $('paso').querySelector('small').textContent = `Paso ${ps[0]} de 7`; $('paso').querySelector('b').textContent = ps[1];
    [...$('puntos').children].forEach((d, i) => d.classList.toggle('on', i < ps[0])); }
  st($('paso'), { opacity: ps ? 1 : 0, transform: `translateY(${ps ? 0 : -10}px)` }); $('puntos').style.opacity = ps ? 1 : 0;
  // subtítulo de la frase actual
  const seg = Object.values(T).find(s => t >= s.inicio - .12 && t < s.fin + .3);
  if (seg) { const sub = $('sub'); if (sub.dataset.id !== seg.id) { sub.dataset.id = seg.id; sub.textContent = seg.texto; } sub.style.opacity = Math.min(S(t, seg.inicio - .12, seg.inicio + .08), 1 - S(t, seg.fin + .1, seg.fin + .3)); }
  else $('sub').style.opacity = 0;
  if (actual?.nombre === 'cierre') $('sub').style.opacity = 0;
  // cursor y clic
  if (CURSOR) st($('cursor'), { opacity: CURSOR[2], transform: `translate(${CURSOR[0] - 8}px,${CURSOR[1] - 4}px)` }); else $('cursor').style.opacity = 0;
  if (CLIC) { const k = CLIC[2]; st($('clic'), { left: CLIC[0] + 'px', top: CLIC[1] + 'px', opacity: 1 - k, transform: `scale(${1 + k * 3})` }); } else $('clic').style.opacity = 0;
  $('flash').style.opacity = FLASH; $('negro').style.opacity = clamp(NEGRO);
}
