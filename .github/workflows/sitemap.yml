# Copia cada hora (y al publicar algo nuevo, vía workflow_dispatch desde el backend) el sitemap generado por el backend a public/sitemap.xml
# (Google exige que el sitemap esté en el mismo dominio que las páginas) y escribe
# las páginas estáticas por publicación en public/p/, por juego en public/j/ (scripts/generar-paginas.js).
name: Sitemap

on:
  schedule:
    - cron: '17 * * * *'   # cada hora (el backend además la dispara al publicar)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar sitemap
        run: |
          curl -fsS --retry 3 --max-time 60 https://upgames-production.up.railway.app/seo/sitemap.xml -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          cp /tmp/sitemap.xml public/sitemap.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Páginas por publicación
        run: node scripts/generar-paginas.js
      - name: Publicar si cambió
        run: |
          git add -A public/sitemap.xml public/p public/u public/j
          if git diff --cached --quiet; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "upgames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SEO: sitemap y páginas por publicación actualizados"
          git push
