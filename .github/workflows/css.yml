# Regenera los paquetes de la biblioteca cuando cambian sus partes:
#   public/upgames-app.css  ← hojas de estilo  (scripts/unir-css.js)
#   public/script.js        ← public/js/*.js   (scripts/unir-js.js)
# Así se editan archivos pequeños y la página carga un solo archivo de cada tipo.
name: Paquetes

on:
  push:
    branches: [main]
    paths:
      - 'public/biblioteca.css'
      - 'public/upgames-glass.css'
      - 'public/upgames-estilo.css'
      - 'public/upgames-cyber.css'
      - 'public/upgames-videos.css'
      - 'public/upgames-ux.css'
      - 'scripts/unir-css.js'
      - 'public/js/**'
      - 'scripts/unir-js.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paquetes
  cancel-in-progress: true

jobs:
  unir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/unir-css.js
      - run: node scripts/unir-js.js
      - name: Publicar si cambió
        run: |
          git add public/upgames-app.css public/script.js public/biblioteca.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "upgames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paquetes de la biblioteca regenerados (CSS y script.js)"
          git push
