<!DOCTYPE html>

<!-- Entrada de upgames.games: lleva directo a la biblioteca (navegar y descargar es libre).
     El login es opcional y vive en login.html. Los enlaces de los correos
     (?reset_token=, ?verif=) siguen llegando aquí y se reenvían al login. -->
<script>
  (function () {
    var q = location.search, p = new URLSearchParams(q);
    // Enlace de invitación (?ref=usuario): se recuerda 30 días para cuando se registre
    var ref = (p.get('ref') || '').replace(/[^\w.-]/g, '').slice(0, 40);
    try { if (ref) localStorage.setItem('ug_ref', JSON.stringify({ c: ref, t: Date.now() })); } catch (e) {}
    if (p.get('reset_token') || p.get('verif') || p.get('volver') || p.has('login') || p.has('registro')) {
      location.replace('./login.html' + q + location.hash);
    } else {
      location.replace('./public/biblioteca.html' + location.hash);
    }
  })();
</script>
